# One of three invented places in this sample, each drawing on a different
# real tradition. `species` is deliberately empty here too: several species
# live in Vagharzan and share its names. This tool ships no
# species-to-tradition mappings — that mapping is a setting-authorship
# decision, not this tool's to make. Lookup happens by tradition
# (`generate_names.py sogdian`), never by species.
#
# `draws_on` names a real, attested, historical tradition so you know where
# to look for source material. Sogdian was the lingua franca of the Silk
# Road; its inventory here leans on consonant clusters (farn, khsh, vagh)
# distinct from the other two cultures in this sample.

name            = "Vagharzan"
species         = ""
draws_on        = "Sogdian"
categories      = ["personal"]
family          = ["Vandarz", "Ashtoqar", "Ghurmat", "Nanaivant", "Spadanak"]
given_personal  = ["farn", "khshath", "vaghn", "zharm", "spadan", "nask"]
place           = ["Vaghar", "Farna", "Khshap", "Zaraf", "Spanta"]
place_tail      = ["zan", "kath", "van", "mard", "gird"]
