# One of two cultures in this sample chosen to contrast generation knobs.
# `species` is deliberately empty: a culture here is a PLACE, not a people —
# several species live in Hattuwassa and share its names. This tool ships no
# species-to-tradition mappings; that decision belongs to setting authorship,
# not to this tool.
#
# `draws_on` names a real, attested, historical tradition — Hittite, the
# Bronze Age Anatolian language of the Hattusa archives — so you know where
# to look for source material.
#
# This culture isolates the "wide" end of the generation knobs: `join =
# "hyphen"` visibly joins multi-syllable given names with a dash, a nonzero
# `place_split` sometimes renders a place name as two words instead of one,
# and `given_syllables` spreads across 1-3 syllables so both effects show up
# across a handful of draws. Contrast with zimrigal.toml, which pins all
# three knobs the other way.

name            = "Hattuwassa"
species         = ""
draws_on        = "Hittite"
categories      = ["personal"]
family          = ["Suppiluli", "Hattusil", "Muwatal", "Telipin", "Arnuwand"]
given_personal  = ["hassu", "labar", "tawa", "muwa", "telep", "arnu", "puduh", "zippa", "tar", "ha"]
place           = ["Hattu", "Zippa", "Kumma", "Labar", "Puduh"]
place_tail      = ["wassa", "rikka", "ndiya", "ssara", "wanda"]
join            = "hyphen"
place_split     = 0.5
given_syllables = { min = 1, max = 3, weights = [0.2, 0.5, 0.3] }
