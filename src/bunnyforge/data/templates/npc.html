<!--
AGENT CONTRACT — read this once per file, then ignore it.

Every file in this workspace opens with a YAML front-matter block.
The `summary` field is the most important line in the file: it is written to be
retrievable on its own, so it should name the entity, its role, and its current
status in one or two plain sentences. Repeat proper nouns here rather than using
pronouns.

`aliases` exists so that a search for any name a thing is known by will surface
this file. Add every nickname, title, and epithet.

`status` is one of: active, dormant, resolved, unused, retired.
`canon` is one of: canon, draft, speculative, perception. Never treat
`speculative` content as established fact; it is material under consideration
only. `perception` marks player-authored material: a record of what the players
believed, which may be wrong. Never treat it as a statement about what is true.

Do not invent facts to fill empty sections. If a section is empty, it is unknown
and should be flagged as a question rather than answered.
-->
<h1 id="section"><Full Name></h1>
<h2 id="one-line-hook">One-line hook</h2>
<!-- How you would describe them to a player in a single sentence. -->
<h2 id="want">Want</h2>
<!-- The active, present-tense goal. Not a personality trait — a thing they are
     trying to get. If you cannot state it as a verb phrase, keep working. -->
<h2 id="obstacle">Obstacle</h2>
<!-- What stands between them and the want. Often another NPC or faction. -->
<h2 id="method">Method</h2>
<!-- How they pursue the want. This is what makes them feel distinct in play. -->
<h2 id="voice">Voice</h2>
<!-- Speech patterns, vocabulary, rhythm, verbal tics, what they never say.
     Include one or two sample lines an agent can pattern-match against. -->
<h2 id="appearance-and-first-impression">Appearance and first
impression</h2>
<!-- What the party notices in the first ten seconds. -->
<h2 id="relationships">Relationships</h2>
<!-- - [[other-entity]] — nature of the relationship, and its current temperature. -->
<h2 id="what-they-know">What they know</h2>
<!-- Explicit list. Information asymmetry lives here. Note how they learned it. -->
<h2 id="what-they-do-not-know">What they do not know</h2>
<!-- Equally important. Prevents an agent from writing them as omniscient. -->
<h2 id="secrets">Secrets</h2>
<!-- Things true about them that the party has not learned. Note what would
     reveal each one. -->
<h2 id="history-with-the-party">History with the party</h2>
<!-- Chronological. Cite session numbers: [[session-014]]. -->
<h2 id="if-unengaged">If unengaged</h2>
<!-- What they do over the next few weeks if the party ignores them. This is what
     makes the world feel like it moves on its own. -->
<h2 id="statblock">Statblock</h2>
<!-- Base statblock plus modifications, or a pointer to Mechanics/. -->
<h2 id="open-questions">Open questions</h2>
<!-- Undecided things about this NPC. Mirror into open-questions.md if load-bearing. -->
