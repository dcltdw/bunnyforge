name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Stdlib only at runtime; the install is the package itself (editable).
      - name: Install bunnyforge
        run: pip install -e .
      # Discovery only. run_tests -- the "script door" -- runs a CAMPAIGN's
      # tests from inside a workspace, under a snapshot guard protecting
      # irreplaceable hand-written campaign content. This repo is neither a
      # workspace nor a holder of such content, and should not become one
      # to satisfy a criterion written when tool and campaign shared a tree.
      # It still ships, and is what `bunnyforge test` runs for users.
      - name: Suite, discovery door
        run: python3 -m unittest discover -s tests -t . -v
      - name: Portability check
        run: python3 tests/check_portability.py
      # The regression setup_campaign.py never had: a workspace built by
      # init must pass checkup with no manual fixes.
      - name: Init-then-checkup
        run: |
          bunnyforge init "${RUNNER_TEMP}/ci-demo" --name Demo
          bunnyforge review checkup --workspace "${RUNNER_TEMP}/ci-demo"
      # The script door's mutation guard, right-sized to this repo: nothing
      # here is git-ignored except build artifacts, so git sees any write a
      # test makes into the tree -- which is what that guard is for.
      - name: No test wrote into the repo
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # The `suite` matrix installs bunnyforge without the `mcp` extra, so every
  # OAuth and MCP-server test is HAVE_MCP-skipped there. One job, one Python
  # version: the matrix above already covers version portability, and this
  # job exists only to prove the auth layer -- the thing standing between a
  # tunnel and a campaign's secrets -- actually executes somewhere.
  mcp-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install bunnyforge with the mcp extra
        run: pip install -e '.[mcp]'
      - name: Suite, discovery door
        run: python3 -m unittest discover -s tests -t . -v
